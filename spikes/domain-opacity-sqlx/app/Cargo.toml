[package]
name = "app"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fw.workspace = true
mac = { path = "../mac" }
sqlx.workspace = true

[dev-dependencies]
tokio.workspace = true

# One feature per probe, all off by default, so the default build is the design
# as the specs describe it and each probe is named in run.sh's output.
[features]
p2-from-repr = []
p3-as-repr = []
p4-direct-field = []
p6-flat-as-repr = []
p7-private-repr-fields = []
p9-trait-from-repr = []
p10-pub-repr = []
p13-pub-crate-inner = []
p4b-same-module-assign = []
p14-hidden-module-repr = []
p16-derive-newtype = []
p17-derive-repr-only = []
p18-newtype-named-field = []
p19-flat-cached-repr = []
p20-repr-debug-clone = []
# --- #33: the candidate gates, and the mechanism ---
p22-token-missing = []
p23-token-stolen = []
p24-proof-forged = []
p26-confined-handler = []
p29-same-module-forge = []
p30-secret-repr-hidden = []
# --- #33 review round 2: the dominating mechanism and the holes it closes ---
p31-nested-user-helper = []
p32-root-nested = []
p33-root-flat = []
p34-nested-as-repr = []
p35-nested-repr-debug = []
p36-trait-defeats = []
p37-proof-wording = []
