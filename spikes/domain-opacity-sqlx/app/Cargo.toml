[package]
name = "app"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fw.workspace = true
mac = { path = "../mac" }
sqlx.workspace = true
# Optional: only P41 needs it, and the default build must stay the shape the
# specs describe.
serde = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true

# One feature per probe, all off by default, so the default build is the design
# as the specs describe it and each probe is named in run.sh's output.
[features]
p38-adr0010-from-derive = []
p39-adr0010-from-attribute = []
p39b-attribute-forgery = ["p39-adr0010-from-attribute"]
p39c-legitimate-route = ["p39-adr0010-from-attribute"]
p39d-repr-not-nameable = ["p39-adr0010-from-attribute"]
p39e-repr-not-nameable-elsewhere = ["p39-adr0010-from-attribute"]
p40-derive-can-confine = []
p40a-derive-confine-forgery = ["p40-derive-can-confine"]
p2-from-repr = []
p3-as-repr = []
p4-direct-field = []
p6-flat-as-repr = []
p7-private-repr-fields = []
p9-trait-from-repr = []
p10-pub-repr = []
p13-pub-crate-inner = []
p4b-same-module-assign = []
p14-hidden-module-repr = []
p16-derive-newtype = []
p17-derive-repr-only = []
p18-newtype-named-field = []
p19-flat-cached-repr = []
p20-repr-debug-clone = []
# --- #33: the candidate gates, and the mechanism ---
p22-token-missing = []
p23-token-stolen = []
p24-proof-forged = []
p26-confined-handler = []
p29-same-module-forge = []
p30-secret-repr-hidden = []
# --- #33 review round 2: the dominating mechanism and the holes it closes ---
p31-nested-user-helper = []
p32-root-nested = []
p33-root-flat = []
p34-nested-as-repr = []
p35-nested-repr-debug = []
p36-trait-defeats = []
p37-proof-wording = []
# --- #44: the derives the USER attaches (path 26) and field-type insides (28) ---
p42-derive-above-attribute = []
p46-derive-below-attribute = []
p43-keep-shape-same-module = ["dep:serde"]
p44-keep-shape-confined = []
p45-alias-interior-mutability = []
p47-spelling-independent = []
p48-repr-copy-rejected = []
p49-copy-blocked-structurally = []
p50-deserialize-below = ["dep:serde"]
p51-allowlist-too-narrow = []
p53-denylist-passes-alias = []
p54-denylist-catches-direct = []
p52-bound-check-rejects-alias = []
# --- #35: the forgery route's second instance, previously prose-only ---
p41-repr-deserialize = ["p10-pub-repr", "dep:serde"]
