# T-M1-01 / #13 — spike: Domain opacity × sqlx.
#
# An INDEPENDENT workspace. It is deliberately not a member of the root
# workspace, for a reason measured rather than assumed: sqlx 0.9.0 declares
# `rust-version = 1.94.0` and pulls 144 packages, while Verum's MSRV is 1.85.
# As a member it would break the MSRV job immediately, force `deny.toml`'s
# allow-list open, and put a 144-package build on every PR — none of which the
# spike needs to answer its question.
#
# The `[workspace]` table below is what keeps it independent: without it, cargo
# refuses to build a package that sits inside the root workspace directory but
# is absent from its `members`.
[workspace]
resolver = "3"
members = ["fw", "mac", "app", "separate-repo"]

[workspace.package]
edition = "2024"
publish = false

# `#![deny(unexpected_cfgs)]` in a lib.rs does NOT reach that package's integration
# test crates, so two of the four probe-hosting crates were uncovered — measured. A
# package-level lint does reach them, and unlike RUSTFLAGS it does not judge sqlx's
# 144 dependencies.
[workspace.lints.rust]
unexpected_cfgs = "deny"

[workspace.dependencies]
# Not pinned. The verdict is version-dependent, so run.sh prints the version it
# actually measured — a future divergence should surface as a changed number,
# not silently.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "postgres",
    "macros",
] }
tokio = { version = "1", features = ["macros", "rt"] }
# P41's forgery instance. Unpinned for the same reason as sqlx above. `serde` is
# here because #35 asks for BOTH measured instances of the forgery route, and
# `serde::Deserialize` was the one that had never been compiled — it appeared in
# #13's prose only.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fw = { path = "fw" }
app = { path = "app" }
