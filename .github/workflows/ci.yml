name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR/branch; never cancel pushes to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --------------------------------------------------------------------------
  # Format check
  # --------------------------------------------------------------------------
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # --------------------------------------------------------------------------
  # Clippy on the full feature set. The lint table lives in the workspace
  # manifest (`[workspace.lints]`), so this also proves both crates opted in.
  # --------------------------------------------------------------------------
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `--all-targets` so tests are linted too. Without it clippy sees lib targets
      # only, and `disallowed_macros` (docs/rules/logging.md) would hold locally while
      # silently not holding in CI — a committed `println!` in a test would pass.
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  # --------------------------------------------------------------------------
  # Tests. The `ui` target carries `test = false`, so `cargo test --workspace`
  # never picks it up — UI tests run only where they are named explicitly. That
  # is what keeps the judgement on the MSRV job.
  # The advisory run below reports .stderr drift on new rustc without blocking:
  # a mismatch here means the expectations will need regenerating when the MSRV
  # is raised, not that this PR is wrong (T-M1-04 measures the drift).
  # --------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - name: UI tests (advisory — MSRV is authoritative)
        continue-on-error: true
        run: cargo test -p verum --test ui

  # --------------------------------------------------------------------------
  # MSRV: verify the workspace still compiles on the declared minimum
  # (Cargo.toml `rust-version`). `check` only — clippy lints are version-
  # specific and belong on the stable job.
  #
  # This job also owns the UI tests, which is Verum-specific. Compile errors
  # are the specification here, and they carry cons lists and `There<There<..>>`
  # index types whose wording drifts between rustc versions. Judging .stderr on
  # a moving toolchain makes it churn for reasons unrelated to any change, so
  # the judgement is pinned (docs/rules/test.md §1.4).
  #
  # Pinned to the exact patch rather than `1.85`, which resolves to the latest
  # 1.85.x: determinism is the whole premise, and this verifies the declared
  # floor literally.
  #
  # This step is also the ONLY thing that enforces the dev-dependency MSRV:
  # `cargo check` above does not build dev-dependencies, so a trybuild release
  # requiring a newer rustc passes the check step and fails only here. It must
  # therefore stay unconditional — an `if:` guard would turn "the harness went
  # missing" and "the dev-deps outgrew the MSRV" into silent skips.
  # --------------------------------------------------------------------------
  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features
      - name: UI tests (.stderr is judged here)
        run: cargo test -p verum --test ui

  # --------------------------------------------------------------------------
  # Docs — `cargo doc` with `-D warnings` catches doc warnings and broken
  # intra-doc links before they reach main. RUSTDOCFLAGS is load-bearing, not
  # decoration: broken links are a warn-by-default lint, so a plain `cargo doc`
  # exits 0 and this job would catch nothing.
  # --------------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # --------------------------------------------------------------------------
  # Module boundary — where a forbidden crate may be named in the source at all.
  # No toolchain, no cache: a checkout and a grep, so it answers in seconds and
  # stays green even when nightly churn breaks the public-api job below.
  # --------------------------------------------------------------------------
  boundary:
    name: Module boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # The guard's own spec: fixtures that must be rejected and fixtures that
      # must be accepted. Without the second half, a guard that rejects
      # everything would look healthy.
      - run: .github/scripts/check-api-boundary-test.sh
      - run: .github/scripts/check-api-boundary.sh imports

  # --------------------------------------------------------------------------
  # Public API — the check that buys the freedom to drop Axum later (ARK-001).
  # Expose a foreign type once and it can never be removed, and the rule cannot
  # be enforced by eye: types leak through return positions and trait bounds.
  #
  # This does not subsume the boundary job. `cargo public-api` renders
  # `pub use axum::Router` as `pub use verum::Router`, erasing provenance, so
  # re-exports are invisible here and only the grep above catches them.
  #
  # The nightly is pinned inside the script, along with the cargo-public-api
  # version it must match — rustdoc JSON is unstable and the two travel together.
  # rustup installs the pinned toolchain on first use.
  # --------------------------------------------------------------------------
  public-api:
    name: Public API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked --version 0.52.0
      - run: .github/scripts/check-api-boundary.sh public-api

  # --------------------------------------------------------------------------
  # Dependency policy — deny.toml. #5 established the licence property with a
  # point-in-time audit table; this is the permanent form, because that table
  # dies at Phase 5 (tokio / hyper / tower / axum) and Phase 7 (sqlx).
  #
  # No toolchain *step* and no cache: nothing is compiled, so this answers in
  # seconds. It still needs cargo on PATH — `cargo deny` is a cargo subcommand and
  # resolves the graph through `cargo metadata` — which the runner image provides.
  # If that ever stopped being true the step would fail loudly, not silently pass.
  # --------------------------------------------------------------------------
  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # deny.toml before cargo-deny, because cargo-deny reports `ok` for whatever it
      # was not configured to look at: a loosened config goes quiet rather than red.
      # The guard's own spec runs first, so a guard that rejects everything — or
      # nothing — cannot look healthy. Same pairing as the boundary job above.
      - run: .github/scripts/check-deny-config-test.sh
      - run: .github/scripts/check-deny-config.sh
      # Pinned for the same reason cargo-public-api is: the config schema is
      # version-specific. An unexpected key is a hard error in cargo-deny, so an
      # unpinned upgrade would fail this job for a reason unrelated to any
      # dependency. install-action ships a prebuilt binary, so unlike the
      # public-api job there is no `cargo install` from source.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # These three are decided by Cargo.lock alone, so they are deterministic
      # and they block.
      - run: cargo deny check licenses bans sources
      # Advisories are not. They depend on an upstream database that changes
      # without any PR, so a newly published RUSTSEC entry would redden a change
      # that touched no dependency. Reported, not blocking — the same treatment,
      # and the same reason, as the stable UI-test step above.
      - name: Advisories (advisory — depends on an upstream database)
        continue-on-error: true
        run: cargo deny check advisories

  # --------------------------------------------------------------------------
  # Aggregation gate: the single required check for branch protection. Passes
  # only if every job above succeeded. Referencing just this check keeps branch
  # protection stable as jobs are added or renamed.
  # --------------------------------------------------------------------------
  ci:
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - msrv
      - docs
      - boundary
      - public-api
      - deny
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Success
        run: exit 0
