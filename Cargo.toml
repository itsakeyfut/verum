[workspace]
members = ["crates/verum", "crates/verum-macros"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
# Forced, not preferred: async closures (`ctx.when`) and
# `#[diagnostic::do_not_recommend]` both stabilised in 1.85, and edition 2024
# requires it. Raising this later is a breaking change — see
# docs/rules/api-surface.md §7.
rust-version = "1.85"
repository = "https://github.com/itsakeyfut/verum"
# The Rust ecosystem default. Settled now rather than after outside
# contributors arrive, when it would need everyone's agreement to change.
license = "MIT OR Apache-2.0"

# Crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
# `forbid`, not `deny`: it cannot be silenced by a stray `#[allow]`, so relaxing
# the policy always shows up in a diff. Verum sits on safe abstractions and
# needs no `unsafe` of its own (docs/rules/unsafe.md).
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
# The public API is what an AI reads; docs are a first-class artifact here.
missing_docs = "warn"
# Supports the Dependency Hiding Rule by catching unintended `pub`.
unreachable_pub = "warn"

[workspace.lints.clippy]
# `priority = -1` lets individual lints below override the group.
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
# Enforces the logging policy (docs/rules/logging.md); the list lives in
# `clippy.toml`. `forbid`, not `deny`, for the same reason as `unsafe_code` above:
# measured, a stray `#[allow(clippy::disallowed_macros)]` silences this completely at
# `deny`, whereas at `forbid` it is a hard error (E0453). Relaxing the policy has to
# happen here, in a diff.
disallowed_macros = "forbid"
# Same policy, different lint: `write!(std::io::stdout(), ..)` expands to `std::write`,
# which `disallowed_macros` cannot ban because `write!` is legitimate in every
# `Display` / `Debug` impl. The function that hands out the stream is what to catch.
disallowed_methods = "forbid"

[workspace.dependencies]
# Pinned with `=` on purpose: generated code calls `::verum::` internals, so a
# version skew between the two crates fails at macro expansion rather than at
# dependency resolution. See docs/rules/proc-macro.md §7.
verum-macros = { version = "=0.0.0", path = "crates/verum-macros" }

trybuild = "1.0.119"

proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full", "extra-traits"] }
